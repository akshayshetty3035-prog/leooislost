<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Leo Finds His Way Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Little Leo Finds His Way Home</h1>
  <p class="sub">A 60-second story in 6 connected scenes of 10 seconds each.</p>

  <div id="stage" role="img" aria-label="Animated story scene">
    <div id="ground"></div>
    <div id="cap"></div>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div class="row">
    <button id="play">Play</button>
    <button id="restart" class="alt">Restart</button>
    <span id="time">0:00 / 1:00</span>
  </div>
  <div class="dots" id="dots"></div>
  <p class="note">This is a stylized animated version made with HTML, CSS and JavaScript. Photorealistic footage needs an AI video tool and the prompt.</p>
</div>
<script src="script.js"></script>
</body>
</html>
